name: Update Ohio early vote data
on:
  schedule: [{cron: "7 1 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/aggregate.py --download
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update early vote snapshot" && git push)
